[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "symbolon-client"
version = "1.0.0"
description = "Official Python SDK for the Symbolon Floating & Enterprise License Server"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Symbolon Authors", email = "dev@symbolon.org" }
]
keywords = ["licensing", "floating-licenses", "concurrent-seats", "post-quantum", "enterprise"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "urllib3>=1.26.0"
]

[project.urls]
Homepage = "https://github.com/MAGORS-organisation/License-server"
Repository = "https://github.com/MAGORS-organisation/License-server.git"
