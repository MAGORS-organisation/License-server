name: Release Multi-Platform SDKs

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-and-release:
    name: Build, Package & Publish Multi-Platform SDKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Packaging Tools
        run: pip install build twine

      - name: Run Tests (All SDKs)
        run: |
          dotnet test Symbolon.slnx -c Release
          python -m unittest discover sdk/python/symbolon/tests
          npm test --prefix sdk/wasm

      - name: Package All SDKs
        run: |
          chmod +x deploy/scripts/pack-all.sh
          ./deploy/scripts/pack-all.sh dist Release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: symbolon-sdks-dist
          path: dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
