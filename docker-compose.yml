# ==============================================================================
# Symbolon Production & Staging Docker Compose Stack
# Usage: docker compose up -d --build
# ==============================================================================

services:
  postgres:
    image: postgres:17-alpine
    container_name: symbolon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-symbolon}
      POSTGRES_USER: ${POSTGRES_USER:-symbolon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-symbolon_secret_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-symbolon} -d ${POSTGRES_DB:-symbolon}"]
      interval: 5s
      timeout: 5s
      retries: 5

  controlplane:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.controlplane
    container_name: symbolon-controlplane
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__SymbolonDb: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-symbolon};Username=${POSTGRES_USER:-symbolon};Password=${POSTGRES_PASSWORD:-symbolon_secret_dev}"
      ASPNETCORE_ENVIRONMENT: "${CONTROLPLANE_ENV:-Production}"
      ASPNETCORE_HTTP_PORTS: "8080"
      Symbolon__AdminApiKey: "${SYMBOLON_ADMIN_API_KEY:-sym_adm_master_2026}"
      Symbolon__PqcProfile: "${SYMBOLON_PQC_PROFILE:-hybrid-v1}"
    ports:
      - "${CONTROLPLANE_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  relay:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.relay
    container_name: symbolon-relay
    restart: unless-stopped
    depends_on:
      - controlplane
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_HTTP_PORTS: "8081"
      Database__ConnectionString: "Data Source=/app/data/symbolon-relay.db"
      Upstream__Url: "http://controlplane:8080"
    ports:
      - "${RELAY_HTTP_PORT:-8081}:8081"
    volumes:
      - relay_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8081/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: symbolon-prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - controlplane
      - relay

  grafana:
    image: grafana/grafana:11.2.0
    container_name: symbolon-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/symbolon-dashboard.json:/var/lib/grafana/dashboards/symbolon-dashboard.json:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  relay_data:
  prometheus_data:
  grafana_data:
