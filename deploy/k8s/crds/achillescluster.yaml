apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: achillesclusters.licensing.achilles.io
  labels:
    app.kubernetes.io/name: achilles
    app.kubernetes.io/part-of: achilles-operator
spec:
  group: licensing.achilles.io
  names:
    kind: AchillesCluster
    listKind: AchillesClusterList
    plural: achillesclusters
    singular: achillescluster
    shortNames:
      - acluster
      - achcluster
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas:
                  type: integer
                  minimum: 1
                  default: 2
                pqcEnabled:
                  type: boolean
                  default: true
                database:
                  type: object
                  properties:
                    host:
                      type: string
                    port:
                      type: integer
                    name:
                      type: string
                    username:
                      type: string
                    existingSecret:
                      type: string
                crypto:
                  type: object
                  properties:
                    keyAlg:
                      type: string
                      default: "Hybrid"
                    autoGenerate:
                      type: boolean
                      default: true
                monitoring:
                  type: object
                  properties:
                    serviceMonitor:
                      type: boolean
                      default: true
            status:
              type: object
              properties:
                phase:
                  type: string
                readyReplicas:
                  type: integer
                activeKid:
                  type: string
                lastReconciledAt:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
      additionalPrinterColumns:
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: PQC
          type: boolean
          jsonPath: .spec.pqcEnabled
