apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: achillesseatclaims.licensing.achilles.io
  labels:
    app.kubernetes.io/name: achilles
    app.kubernetes.io/part-of: achilles-operator
spec:
  group: licensing.achilles.io
  names:
    kind: AchillesSeatClaim
    listKind: AchillesSeatClaimList
    plural: achillesseatclaims
    singular: achillesseatclaim
    shortNames:
      - asclaim
      - achclaim
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - licenseRef
                - machineId
              properties:
                licenseRef:
                  type: string
                  description: Reference to AchillesLicense resource or license key.
                machineId:
                  type: string
                  description: Hardware node or pod identifier claiming the seat.
                userId:
                  type: string
                  description: Optional engineer or workload identity.
                department:
                  type: string
                  description: Cost center or department code.
                features:
                  type: array
                  items:
                    type: string
                  description: Requested feature module codes.
                durationMinutes:
                  type: integer
                  default: 60
                  minimum: 5
                  description: Requested lease lifetime.
                allowQueue:
                  type: boolean
                  default: true
                  description: Enter FLT-31 queue if floating pool is exhausted.
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Bound
                    - Released
                    - Queued
                    - Failed
                leaseId:
                  type: string
                seatNo:
                  type: integer
                expiresAt:
                  type: string
                  format: date-time
                lastReconciledAt:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
      additionalPrinterColumns:
        - name: License
          type: string
          jsonPath: .spec.licenseRef
        - name: Machine
          type: string
          jsonPath: .spec.machineId
        - name: Seat
          type: integer
          jsonPath: .status.seatNo
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Expires
          type: string
          jsonPath: .status.expiresAt
