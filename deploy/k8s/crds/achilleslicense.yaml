apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: achilleslicenses.licensing.achilles.io
  labels:
    app.kubernetes.io/name: achilles
    app.kubernetes.io/part-of: achilles-operator
spec:
  group: licensing.achilles.io
  names:
    kind: AchillesLicense
    listKind: AchillesLicenseList
    plural: achilleslicenses
    singular: achilleslicense
    shortNames:
      - alic
      - achlic
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - tenantId
                - productId
              properties:
                tenantId:
                  type: string
                  description: Unique enterprise tenant identifier.
                productId:
                  type: string
                  description: Licensed product catalog SKU code.
                features:
                  type: array
                  items:
                    type: string
                  description: Enabled entitlement features and modules.
                maxSeats:
                  type: integer
                  minimum: 1
                  default: 10
                  description: Concurrent floating seat quota.
                expiresAt:
                  type: string
                  format: date-time
                  description: Absolute license validity deadline.
                targetSecretName:
                  type: string
                  description: Kubernetes secret where cryptographic tokens are mounted.
                suspended:
                  type: boolean
                  default: false
                  description: Whether this license is administratively disabled.
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Active
                    - Suspended
                    - Revoked
                    - Expired
                    - Failed
                licenseId:
                  type: string
                issuedKeyHash:
                  type: string
                signatureAlg:
                  type: string
                secretRef:
                  type: string
                lastReconciledAt:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
      additionalPrinterColumns:
        - name: Tenant
          type: string
          jsonPath: .spec.tenantId
        - name: Product
          type: string
          jsonPath: .spec.productId
        - name: Seats
          type: integer
          jsonPath: .spec.maxSeats
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
