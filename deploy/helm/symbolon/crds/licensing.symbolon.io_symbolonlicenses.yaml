apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: symbolonlicenses.licensing.symbolon.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.0
spec:
  group: licensing.symbolon.io
  names:
    kind: SymbolonLicense
    listKind: SymbolonLicenseList
    plural: symbolonlicenses
    singular: symbolonlicense
    shortNames:
      - slic
      - symlic
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Status
          type: string
          jsonPath: .status.phase
        - name: Product
          type: string
          jsonPath: .spec.productId
        - name: Seats
          type: integer
          jsonPath: .spec.maxSeats
        - name: License-ID
          type: string
          jsonPath: .status.licenseId
        - name: Secret
          type: string
          jsonPath: .spec.targetSecretName
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: SymbolonLicense represents a declarative GitOps license specification managed by the Symbolon Operator.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: Desired specification of the Symbolon license.
              required:
                - tenantId
                - productId
                - maxSeats
              properties:
                clusterRef:
                  type: object
                  description: Reference to the target SymbolonCluster.
                  properties:
                    name:
                      type: string
                      default: symbolon-cluster
                    namespace:
                      type: string
                tenantId:
                  type: string
                  description: Identifier of the tenant organization.
                productId:
                  type: string
                  description: Identifier of the licensed product.
                features:
                  type: array
                  items:
                    type: string
                  description: List of enabled feature flags / entitlements.
                maxSeats:
                  type: integer
                  minimum: 1
                  default: 10
                  description: Maximum number of concurrent floating seats.
                expiresAt:
                  type: string
                  format: date-time
                  description: ISO 8601 expiration timestamp. If omitted, defaults to permanent license.
                nodeLockFingerprints:
                  type: array
                  items:
                    type: string
                  description: Specific hardware fingerprint SHA-256 digests required for node-locked operation.
                targetSecretName:
                  type: string
                  description: Name of the Kubernetes Secret where the signed .symlic license key is stored.
                suspended:
                  type: boolean
                  default: false
                  description: If true, the license is revoked and made unavailable to clients.
            status:
              type: object
              description: Observed status of the provisioned license.
              properties:
                phase:
                  type: string
                  enum: [Pending, Active, Suspended, Revoked, Expired, Failed]
                licenseId:
                  type: string
                issuedKeyHash:
                  type: string
                signatureAlg:
                  type: string
                secretRef:
                  type: string
                lastReconciledAt:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
